<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compartiendo ficha...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      background: #f0fdf4;
      color: #15803d;
      flex-direction: column;
      gap: 16px;
    }
    .icono { font-size: 3rem; }
    .mensaje { font-size: 1rem; font-weight: 600; letter-spacing: 0.05em; }
    .sub { font-size: 0.8rem; color: #666; }
  </style>
</head>
<body>

  <div class="icono">📲</div>
  <div class="mensaje">Abriendo WhatsApp...</div>
  <div class="sub">Redirigiendo en un momento</div>

  <script>
    (function () {

      // ── Leer código desde la URL ──────────────────────────────
      const params = new URLSearchParams(window.location.search);
      const codigo = params.get("codigo");

      if (!codigo) {
        document.querySelector(".mensaje").textContent = "Código no encontrado";
        document.querySelector(".sub").textContent = "Verifica el link e intenta de nuevo";
        return;
      }

      // ── Construir link al Apps Script (ficha OG) ──────────────
      //const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNMuIV9-mCqqMxUgb4FrJElHGNSmoIy38yYL-BCsmoxkS4Vf709_kEY4rdk1JVEsPt/exec";
      //const fichaUrl = `${APPS_SCRIPT_URL}?ficha=${encodeURIComponent(codigo)}`;
      const fichaUrl = `https://teamrealtyhistory.com/fichasws/${encodeURIComponent(codigo)}.html`;

      // ── Abrir WhatsApp con el link listo para enviar ──────────
      const waUrl = `https://wa.me/?text=${encodeURIComponent(fichaUrl)}`;

      setTimeout(function () {
        window.location.href = waUrl;
      }, 800);

    })();
  </script>

</body>
</html>
