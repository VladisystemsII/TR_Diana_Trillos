<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin — Team Realty Group</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/admin-leer.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/activar.css">
</head>

<body>

<!-- ══════════════════════════════════════════
     LOGIN
     ══════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <img src="https://res.cloudinary.com/diifewvvs/image/upload/Logo_TR_1_ihwkcs" alt="Team Realty Group">
    </div>
    <h2 class="login-title">Acceso Administrativo</h2>
    <p class="login-sub">Team Realty Group</p>
    <div class="login-form">
      <div class="field-group">
        <label for="login-user">Usuario</label>
        <input type="text" id="login-user" placeholder="usuario" autocomplete="off">
      </div>
      <div class="field-group">
        <label for="login-pass">Contraseña</label>
        <input type="password" id="login-pass" placeholder="••••••••">
      </div>
      <div id="login-error" class="login-error" style="display:none">Credenciales incorrectas</div>
      <button onclick="checkLogin()">Ingresar</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     PANEL ADMIN
     ══════════════════════════════════════════ -->
<div id="admin-panel" style="display:none">

  <!-- CONTENIDO PRINCIPAL -->
  <div id="admin-main">

    <!-- Breadcrumb -->
    <div id="breadcrumb">
      <div class="bc-left">
        <span id="bc-section">Propiedades</span>
        <span class="bc-sep">›</span>
        <span id="bc-view">Crear</span>
      </div>
      <span id="bc-titulo">Nueva Propiedad</span>
    </div>

    <!-- ══════════════════════════════════════
         CONTENEDOR DINÁMICO
         Los módulos se inyectan aquí via fetch()
         desde admin-config.js → cargarModulo()
         ══════════════════════════════════════ -->
    <div id="view-container"></div>
  </div><!-- /admin-main -->

  <!-- ══════════════════════════════════════
       SIDEBAR
       ══════════════════════════════════════ -->
  <aside id="admin-sidebar" class="expanded">

    <button id="sidebar-toggle" title="Colapsar">
      <span class="toggle-icon">‹</span>
    </button>

    <div class="sb-logo">
      <img src="https://res.cloudinary.com/diifewvvs/image/upload/Logo_TR_1_ihwkcs" alt="Team Realty Group">
    </div>

    <div class="sb-identity">
      <span class="sb-name">Diana Trillos</span>
      <span class="sb-badge">Administrador</span>
      <span class="sb-last-access" id="sb-last-access">Cargando…</span>
    </div>

    <div class="sb-divider"></div>

    <div class="sb-counter">
      <span class="counter-num" id="counter-num">—</span>
      <span class="counter-label">propiedades activas</span>
    </div>

    <div class="sb-divider"></div>

    <nav class="sb-nav">
      <div class="sb-nav-item">
        <button class="sb-menu-btn active open" id="btn-sec-propiedades">
          <span class="sb-icon">⊞</span>
          <span class="sb-label">Propiedades</span>
          <span class="sb-arrow">▾</span>
        </button>
        <div class="sb-submenu open" id="sbsub-propiedades">
          <button class="sb-sub active" data-view="crear" onclick="activarVista('crear','Propiedades','Crear',this)">
            <span class="sb-sub-num">1</span><span class="sb-label"> Crear</span>
          </button>
          <button class="sb-sub" data-view="leer" onclick="activarVista('leer','Propiedades','Leer',this)">
            <span class="sb-sub-num">2</span><span class="sb-label"> Leer / Generar Ficha</span>
          </button>
          <button class="sb-sub" data-view="actualizar" onclick="activarVista('actualizar','Propiedades','Actualizar',this)">
            <span class="sb-sub-num">3</span><span class="sb-label"> Actualizar</span>
          </button>
          <button class="sb-sub" data-view="activar" onclick="activarVista('activar','Propiedades','Activar / Desactivar',this)">
            <span class="sb-sub-num">4</span><span class="sb-label"> Activar / Desactivar</span>
          </button>
          <!--<button class="sb-sub" data-view="listado" onclick="activarVista('listado','Propiedades','Ver Listado',this)">
            <span class="sb-sub-num">5</span><span class="sb-label"> Ver Listado</span>
          </button>   -->
        </div>
      </div>

      <div class="sb-nav-item">
        <button class="sb-menu-btn" id="btn-sec-blog">
          <span class="sb-icon">✍</span>
          <span class="sb-label">Blog</span>
          <span class="sb-arrow">▾</span>
        </button>
        <div class="sb-submenu" id="sbsub-blog">
          <button class="sb-sub" data-view="blog-crear" onclick="activarVista('blog-crear','Blog','Crear',this)">
            <span class="sb-sub-num">1</span><span class="sb-label"> Crear</span>
          </button>
          <button class="sb-sub" data-view="blog-leer" onclick="activarVista('blog-leer','Blog','Leer',this)">
            <span class="sb-sub-num">2</span><span class="sb-label"> Leer</span>
          </button>
          <button class="sb-sub" data-view="blog-actualizar" onclick="activarVista('blog-actualizar','Blog','Actualizar',this)">
            <span class="sb-sub-num">3</span><span class="sb-label"> Actualizar</span>
          </button>
        </div>
      </div>
    
    </nav>

    <div class="sb-spacer"></div>

    <div class="sb-footer">
      <div class="sb-footer-brand">
        <span class="sb-label">Grupo Sol de Sipango Ltda</span>
      </div>
      <a href="https://wa.me/573114831846" target="_blank" rel="noopener noreferrer" class="sb-footer-soporte">
        <span class="wa-dot">●</span>
        <span class="sb-label">Soporte · Vladisystems</span>
      </a>
      <div class="sb-footer-version">
        <span class="sb-label">Team Realty Group · v1.0.0</span>
      </div>
      <button class="sb-logout" onclick="logout()">
        <span class="sb-icon">↩</span>
        <span class="sb-label">Cerrar sesión</span>
      </button>
    </div>

  </aside>

</div><!-- /admin-panel -->

<!-- Toast -->
<div id="toast-container"></div>

<!-- Modal confirmación -->
<div id="confirm-overlay" style="display:none">
  <div class="confirm-box">
    <h3 id="confirm-title"></h3>
    <p id="confirm-msg"></p>
    <div class="confirm-actions">
      <button class="btn-secondary" id="modal-cancelar">Cancelar</button>
      <button class="btn-danger" id="confirm-ok">Confirmar</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     SCRIPTS — orden obligatorio
     1. admin-config.js  → configuración global + cargarModulo()
     2. admin-auth.js    → autenticación + navegación + utilidades
     3. propiedades JS   → lógica de cada módulo de propiedades
     4. blog JS          → lógica de cada módulo de blog (próxima iteración)
     ══════════════════════════════════════════ -->
<script src="js/admin-config.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/propiedades/admin-crear.js"></script>
<script src="js/propiedades/admin-leer.js"></script>
<script src="js/propiedades/admin-actualizar.js"></script>
<script src="js/propiedades/admin-activar.js"></script>
<!-- js/propiedades/admin-listado.js    → próxima iteración -->
<script src="js/blog/blog-crear.js"></script>
<script src="js/blog/blog-leer.js"></script>
<script src="js/blog/blog-actualizar.js"></script>

<script src="js/propiedades/admin-compartir-ficha.js"></script>



<!-- js/blog/blog-activar.js            → próxima iteración -->
<!-- js/blog/blog-listado.js            → próxima iteración -->

</body>
</html>
