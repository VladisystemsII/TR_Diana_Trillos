<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propiedades - Team Realty History | Inmobiliaria</title>
  <meta name="description" content="Explora nuestro catálogo de propiedades en venta y arriendo en la zona norte de Bogotá.">
  <meta property="og:title" content="Propiedades - Team Realty History">
  <meta property="og:description" content="Encuentra tu propiedad ideal en la zona norte de Bogotá.">
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- HEADER -->
  <div id="header-container"></div>

  <!-- =======================================
       PANTALLA A: MINIATURAS + FILTRO
       Visible al entrar. Desaparece al elegir filtro.
  ======================================= -->
  <section id="buscadorMiniaturas">
    <div class="container">

      <div class="busqueda-header">
        <h2>¿Buscas en arriendo o en venta?</h2>
        <div class="busqueda-filtros">
          <button class="btn-filtro" data-filtro="venta">En Venta</button>
          <button class="btn-filtro" data-filtro="arriendo">En Arriendo</button>
        </div>
      </div>

      <!-- INDICADOR DE CARGA -->
      <div id="loadingMiniaturas" class="loading-box" role="status"
           aria-live="polite" style="display:none;">
        <h2>Cargando propiedades…</h2>
      </div>

      <!-- GRID DE MINIATURAS -->
      <div class="thumb-grid" id="thumbGrid"></div>

    </div>
  </section>

  <!-- =======================================
       PANTALLA B: FICHAS COMPLETAS (como antes)
       Oculta al entrar. Aparece al elegir filtro.
  ======================================= -->
  <section id="propiedades" style="display:none;">
    <div class="container">

      <!-- Botón volver a miniaturas -->
      <div style="text-align:center; margin-bottom: 40px;">
        <button class="btn-volver-miniaturas" id="btnVolverMiniaturas">
          ← Cambiar búsqueda
        </button>
      </div>

      <h2 id="tituloFichas">Propiedades disponibles</h2>

      <!-- INDICADOR DE CARGA -->
      <div id="loadingPropiedades" class="loading-box" role="status"
           aria-live="polite" style="display:none;">
        <h2>Cargando propiedades…</h2>
      </div>

      <!-- GRID DE CARDS (idéntico al original) -->
      <div class="prop-grid" id="propiedadesGrid"></div>

    </div>
  </section>

  <!-- FOOTER -->
  <div id="footer-container"></div>

  <script src="js/header-loader.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer-loader.js"></script>
  <script src="js/menu-mobile.js"></script>
  <script src="js/config.js"></script>
  <script src="js/propiedades.js"></script>

</body>
</html>
